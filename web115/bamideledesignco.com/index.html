<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bamidele Design Co.</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(160deg, #E9ECF1 0%, #D9DEE7 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .card {
            display: flex;
            width: clamp(340px, 92vw, 760px);
            aspect-ratio: 2 / 1;
            max-height: 92vh;
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(31, 41, 51, 0.18), 0 2px 8px rgba(31, 41, 51, 0.08);
            box-sizing: border-box;
            overflow: hidden;
        }

        .card-side {
            flex: 1;
            min-width: 0;
            padding: clamp(10px, 5%, 30px);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-left {
            text-align: center;
            border-right: 1px solid #E5E7EB;
        }

        .monogram {
            width: clamp(28px, 12%, 52px);
            height: clamp(28px, 12%, 52px);
            margin: 0 auto clamp(4px, 4%, 12px);
            flex-shrink: 0;
        }

        .business-name {
            margin: 0;
            font-size: clamp(11px, 4vh, 20px);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #1F3A5F;
        }

        .accent-line {
            width: 32px;
            height: 3px;
            background-color: #1F3A5F;
            margin: clamp(3px, 2%, 8px) auto;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .tagline {
            margin: 0;
            font-size: clamp(8px, 2vh, 12px);
            font-style: italic;
            color: #6B7280;
        }

        .full-name {
            margin: clamp(6px, 5%, 16px) 0 0;
            font-size: clamp(11px, 3.2vh, 15px);
            font-weight: 700;
            color: #1F2933;
        }

        .title {
            margin: 2px 0 0;
            font-size: clamp(8px, 2vh, 11px);
            color: #6B7280;
        }

        .contact {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: clamp(8px, 2vh, 11.5px);
            color: #1F2933;
        }

        .contact li {
            display: flex;
            align-items: center;
            gap: clamp(5px, 2%, 10px);
            margin-bottom: clamp(4px, 3%, 12px);
        }

        .contact li:last-child {
            margin-bottom: 0;
        }

        .contact-icon {
            width: clamp(11px, 3vh, 16px);
            height: clamp(11px, 3vh, 16px);
            flex-shrink: 0;
            color: #1F3A5F;
        }

        .contact a {
            color: #1F2933;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        /* Below this width, the two-column layout has no room left ---
           stack into a single column instead, like a portrait card. */
        @media (max-width: 480px) {
            .card {
                flex-direction: column;
                aspect-ratio: auto;
                width: clamp(260px, 90vw, 360px);
                max-height: 94vh;
            }

            .card-side {
                flex: none;
                padding: clamp(8px, 3vh, 24px) clamp(16px, 5vw, 28px);
            }

            .card-left {
                border-right: none;
                border-bottom: 1px solid #E5E7EB;
            }

            .monogram {
                width: clamp(26px, 8vh, 48px);
                height: clamp(26px, 8vh, 48px);
            }

            .business-name {
                font-size: clamp(13px, 4vh, 20px);
            }

            .tagline {
                font-size: clamp(8px, 1.8vh, 12px);
            }

            .full-name {
                font-size: clamp(12px, 3vh, 16px);
                margin-top: clamp(4px, 2vh, 10px);
            }

            .title {
                font-size: clamp(8px, 1.6vh, 11px);
            }

            .contact {
                font-size: clamp(8px, 1.6vh, 11px);
                margin-top: clamp(6px, 2vh, 14px);
            }

            .contact li {
                margin-bottom: clamp(2px, 1vh, 8px);
            }

            .contact-icon {
                width: clamp(10px, 2.4vh, 14px);
                height: clamp(10px, 2.4vh, 14px);
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="card-side card-left">
            <svg class="monogram" viewBox="0 0 56 56" role="img" aria-label="Bamidele Design Co. monogram">
                <circle cx="28" cy="28" r="28" fill="#1F3A5F" />
                <text x="28" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                    font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">BD</text>
            </svg>
            <h1 class="business-name">BAMIDELE<br>DESIGN CO.</h1>
            <div class="accent-line"></div>
            <p class="tagline">Web &amp; Brand Design</p>
        </div>

        <div class="card-side card-right">
            <p class="full-name">Olushola Bamidele</p>
            <p class="title">Founder &amp; Creative Director</p>

            <ul class="contact" style="margin-top: clamp(8px, 6%, 18px);">
                <li>
                    <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="M2 6l10 7 10-7"></path>
                    </svg>
                    <a href="mailto:hello@bamideledesignco.com">hello@bamideledesignco.com</a>
                </li>
                <li>
                    <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <span>(704) 555-0148</span>
                </li>
                <li>
                    <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M2 12h20"></path>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <a href="https://bamideledesignco.com">bamideledesignco.com</a>
                </li>
                <li>
                    <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <rect x="2" y="2" width="20" height="20" rx="3" fill="currentColor"></rect>
                        <rect x="6" y="9.5" width="2.6" height="9" fill="#FFFFFF"></rect>
                        <circle cx="7.3" cy="6" r="1.6" fill="#FFFFFF"></circle>
                        <path d="M11.5 9.5h2.5v1.3c.5-.8 1.4-1.5 2.9-1.5 2.5 0 3.6 1.6 3.6 4.4v5.3h-2.6v-4.9c0-1.4-.5-2.3-1.7-2.3-1 0-1.6.7-1.9 1.3-.1.2-.1.6-.1.9v5h-2.6V9.5z" fill="#FFFFFF"></path>
                    </svg>
                    <a href="https://linkedin.com/company/bamideledesignco">linkedin.com/company/bamideledesignco</a>
                </li>
                <li>
                    <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>482 Sycamore Ridge Dr, Suite 210, Charlotte, NC 28202</span>
                </li>
            </ul>
        </div>
    </main>

    <script src="https://lint.page/kit/880bd5.js" crossorigin="anonymous"></script>
</body>

</html>
