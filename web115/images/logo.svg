<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Eko Kitchen logo: a cooking pot with rising steam">
    <title>Eko Kitchen</title>
    <!-- Steam -->
    <path d="M24 14c-2 3 2 4 0 7" fill="none" stroke="#626E3F" stroke-width="2" stroke-linecap="round" />
    <path d="M32 12c-2 3 2 4 0 7" fill="none" stroke="#626E3F" stroke-width="2" stroke-linecap="round" />
    <path d="M40 14c-2 3 2 4 0 7" fill="none" stroke="#626E3F" stroke-width="2" stroke-linecap="round" />

    <!-- Lid knob -->
    <circle cx="32" cy="24" r="2.5" fill="#626E3F" />

    <!-- Lid -->
    <path d="M16 30c0-6.6 7.2-12 16-12s16 5.4 16 12" fill="#626E3F" />
    <rect x="14" y="30" width="36" height="4" rx="2" fill="#626E3F" />

    <!-- Pot handles -->
    <rect x="4" y="36" width="10" height="6" rx="3" fill="#626E3F" />
    <rect x="50" y="36" width="10" height="6" rx="3" fill="#626E3F" />

    <!-- Pot body -->
    <path d="M13 38h38l-3.5 16c-.6 2.9-3.2 5-6.2 5H22.7c-3 0-5.6-2.1-6.2-5L13 38z" fill="#626E3F" />

    <!-- EKO label -->
    <text x="32" y="51" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="11"
        fill="#eef1ef" text-anchor="middle">EKO</text>
</svg>
